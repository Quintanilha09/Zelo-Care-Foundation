name: "Correção"
description: "Algo que já existe está errado"
title: "[Correção] "
labels: ["correcao"]
body:
  - type: markdown
    attributes:
      value: |
        **Antes de abrir:** bug relatado em ambiente real que não se explica pelo
        código precisa ser **reproduzido antes de qualquer edição**. Corrigir pelo
        sintoma já falhou duas vezes seguidas neste projeto.
  - type: textarea
    id: o-que-acontece
    attributes:
      label: O que acontece
      description: O comportamento errado, como você viu.
    validations: { required: true }
  - type: textarea
    id: o-que-deveria
    attributes:
      label: O que deveria acontecer
    validations: { required: true }
  - type: textarea
    id: como-reproduzir
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Entrar como cuidador principal
        2. Abrir a ficha do paciente
        3. ...
    validations: { required: true }
  - type: dropdown
    id: onde
    attributes:
      label: Onde apareceu
      options: ["Replit (app publicado)", "Local", "CI", "Não sei"]
    validations: { required: true }
  - type: textarea
    id: seguranca
    attributes:
      label: Toca em segurança ou dado de paciente?
      description: |
        Isolamento entre famílias, autenticação, consentimento, log com dado
        sensível. Se sim, isto vira prioridade máxima — segurança vence tudo na
        ordem de prioridade do projeto.
