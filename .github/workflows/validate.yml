name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://zelo_ci:zelo_ci@localhost:5432/zelo_ci
      # Os dois PRECISAM ser diferentes. Eram identicos ate 23/08/2026, e isso
      # fundia o painel operacional e a sessao de cuidador num unico dominio de
      # confianca: um token de admin passava por verifyAccessToken como se fosse
      # sessao. O teste que protege essa fronteira falhou com 404 em vez de 401.
      ADMIN_PANEL_SECRET: ci-admin-${{ github.run_id }}-${{ github.run_attempt }}
      SESSION_SECRET: ci-session-${{ github.run_id }}-${{ github.run_attempt }}
      NODE_ENV: test
      CI: "true"
      # Os dois vite.config.ts (zelo e mockup-sandbox) exigem PORT no topo do
      # arquivo e lancam sem ele. A exigencia faz sentido para `vite dev`, que
      # precisa saber onde servir; para `vite build`, que so gera arquivo, o
      # valor e irrelevante — mas o throw esta no topo e roda nos dois casos.
      #
      # Sem esta linha o passo de Build falhava SEMPRE, desde que este workflow
      # veio para o main, e por um motivo sem relacao com o codigo em revisao.
      # CI sempre vermelho e CI que ninguem olha.
      #
      # Sao exatamente DUAS as exigidas, confirmado lendo os dois configs
      # inteiros: PORT e BASE_PATH. REPL_ID e so consultada, nunca exigida.
      # O valor de BASE_PATH nao importa aqui — o build do CI valida que
      # compila, nunca e publicado.
      PORT: "5000"
      BASE_PATH: "/"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zelo_ci
          POSTGRES_USER: zelo_ci
          POSTGRES_PASSWORD: zelo_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zelo_ci -d zelo_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create test database schema
        run: |
          pnpm --filter @workspace/db push
          pnpm --filter @workspace/db push:raw

      - name: Typecheck
        run: pnpm run typecheck

      - name: Enforce clock usage
        run: pnpm --filter @workspace/api-server lint:clock

      # Rápidos e sem banco: falham antes de subir o Postgres se o motor de
      # recorrência quebrar. Ficaram fora do CI até 23/08/2026 — 33 casos que
      # passavam e nunca eram exercidos (auditoria §10).
      # Biome e PORTAO: falha o build. As regras foram calibradas para pegar
      # defeito, nao estilo — ver os comentarios em biome.jsonc.
      - name: Lint (Biome)
        run: pnpm run lint

      # Knip e RELATORIO, nao portao: `|| true` de proposito.
      #
      # A primeira execucao achou 98 arquivos sem uso. Fazer o CI falhar com
      # esse numero criaria um portao que ninguem atravessa — e portao assim se
      # contorna, nao se respeita. O numero aparece no log; apertar ate virar
      # portao e trabalho de outra historia.
      - name: Codigo morto (Knip, so relatorio)
        run: pnpm run deadcode || true

      - name: Run library tests
        run: pnpm run test:libs

      - name: Run integration tests
        run: pnpm --filter @workspace/api-server test:all

      # Playwright por ultimo: e o passo mais caro, e so faz sentido rodar se
      # tudo o mais ja passou. Instala so o chromium — os outros navegadores
      # triplicariam o tempo sem mudar nada do que este app precisa provar.
      - name: Instalar navegador do Playwright
        run: pnpm exec playwright install chromium --with-deps

      - name: Teste de ponta a ponta (Playwright)
        run: pnpm run test:e2e

      # O rastro so existe quando algo falha, e e exatamente ai que ele vale:
      # traz video, captura de tela e a linha do tempo do que aconteceu.
      - name: Guardar o rastro das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-rastro
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Build
        run: pnpm run build
