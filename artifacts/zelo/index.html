<!DOCTYPE html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <!-- lang="pt-BR" sozinho não impede o Chrome de oferecer tradução —
         a decisão dele também considera o idioma preferido do navegador
         do visitante, não só o da página. translate="no" + a meta abaixo
         bloqueiam a tradução automática de vez (Google Translate mexe no
         DOM por fora do React; qualquer atualização de tela depois disso
         quebra com "removeChild" — não é bug de lógica do app). -->
    <meta name="google" content="notranslate" />
    <title>ZELO</title>
    <meta name="description" content="ZELO — built on Replit. Update this description to reflect the app." />
    <meta name="robots" content="index, follow" />
    <meta property="og:title" content="ZELO" />
    <meta property="og:description" content="ZELO — built on Replit. Update this description to reflect the app." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZELO" />
    <meta name="twitter:description" content="ZELO — built on Replit. Update this description to reflect the app." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#659A76" />
    <!-- Web Push no iOS só funciona com o PWA adicionado à Tela de Início e
         aberto nesse modo — ver a tela de orientação em /notificacoes/ios -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ZELO" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!--
      Tema aplicado ANTES DA PRIMEIRA PINTURA — Issue #138.

      Precisa ser inline e síncrono, aqui no `head`. Qualquer coisa feita
      depois — no React, num `useEffect`, ou até num módulo importado —
      acontece **depois** de o navegador já ter pintado a página clara: o
      resultado é um lampejo branco a cada abertura.

      Para quem pediu o modo noturno porque a vista dói, esse lampejo é o
      problema inteiro acontecendo de novo, toda vez. Por isso estas linhas
      são a exceção à regra de "nada de lógica no HTML".

      A lógica é a mesma de `src/lib/tema.ts` — mantida curta de propósito
      para que a duplicação seja óbvia e barata de conferir.
    -->
    <script>
      (function () {
        try {
          var escolha = localStorage.getItem("zelo_tema");
          var escuro =
            escolha === "escuro" ||
            (escolha !== "claro" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (escuro) {
            document.documentElement.classList.add("dark");
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute("content", "#282725");
          }
        } catch (e) {
          /* Armazenamento bloqueado: fica no claro, que é o padrão do CSS. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root" translate="no"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
